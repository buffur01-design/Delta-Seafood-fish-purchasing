name: Update FMF data and deploy website

on:
  push:
    branches:
      - main
  schedule:
    - cron: "20 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fmf-data-and-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-fmf.txt

      - name: Install collector dependencies
        if: github.event_name != 'push'
        run: pip install -r requirements-fmf.txt

      - name: Collect latest FMF telephone auctions
        if: github.event_name != 'push'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            python fmf_auction_collector.py --out data/fmf && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "FMF collection attempt $attempt failed; retrying in 60 seconds."
              sleep 60
            fi
          done
          exit 1

      - name: Commit updated FMF data
        if: github.event_name != 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fmf
          if git diff --cached --quiet; then
            echo "FMF data is already current."
          else
            git commit -m "Update FMF auction data"
            git pull --rebase origin main
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
