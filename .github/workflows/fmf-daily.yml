name: Update FMF auction data

on:
  schedule:
    - cron: "20 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fmf-daily-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-fmf.txt
      - run: pip install -r requirements-fmf.txt
      - name: Collect listed FMF telephone auctions
        run: python fmf_auction_collector.py --out data/fmf
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fmf
          git diff --cached --quiet && exit 0
          git commit -m "Update FMF auction data"
          git push
