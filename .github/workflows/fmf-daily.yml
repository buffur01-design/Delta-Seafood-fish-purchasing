name: Update fisheries data and deploy website

on:
  push:
    branches:
      - main
  schedule:
    - cron: "20 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fisheries-data-and-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-norway]') || contains(github.event.head_commit.message, '[refresh-fmf]')
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-fmf.txt

      - name: Install collector dependencies
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-norway]') || contains(github.event.head_commit.message, '[refresh-fmf]')
        run: pip install -r requirements-fmf.txt

      - name: Collect latest FMF telephone auctions
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-fmf]')
        shell: bash
        run: |
          for attempt in 1 2 3; do
            python fmf_auction_collector.py --out data/fmf && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "FMF collection attempt $attempt failed; retrying in 60 seconds."
              sleep 60
            fi
          done
          exit 1

      - name: Collect latest Hanstholm expected landings
        if: github.event_name != 'push'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            python hanstholm_collector.py --out data/hanstholm/hanstholm.json && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "Hanstholm collection attempt $attempt failed; retrying in 60 seconds."
              sleep 60
            fi
          done
          exit 1

      - name: Refresh Norwegian landing history
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-norway]')
        shell: bash
        run: |
          for attempt in 1 2 3; do
            python norway_collector.py --out data/norway/norway-landings.json && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "Norway collection attempt $attempt failed; retrying in 60 seconds."
              sleep 60
            fi
          done
          exit 1

      - name: Collect latest Vørn fisheries landings
        if: github.event_name != 'push'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            python "Ny mappe/delta_fisheries_collector.py" \
              --out reports \
              --seed-web-json data/fisheries-dashboard.json \
              --seed-web-vessel-dir data/vessels \
              --web-json data/fisheries-dashboard.json \
              --web-vessel-dir data/vessels \
              --collect-vessels \
              --refresh-days 14 \
              --resume && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "Vørn collection attempt $attempt failed; retrying in 60 seconds."
              sleep 60
            fi
          done
          exit 1

      - name: Commit updated fisheries data
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-norway]') || contains(github.event.head_commit.message, '[refresh-fmf]')
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fmf data/fisheries-dashboard.json data/vessels data/hanstholm data/norway
          if git diff --cached --quiet; then
            echo "Fisheries data is already current."
          else
            git commit -m "Update fisheries data"
            git pull --rebase origin main
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
